name: Verify RAWEST SIGNAL
on:
  push:
    paths:
      - 'index.html'
      - 'signal-experience.js'
      - 'signal-v4.js'
      - 'signal-v4-core.js'
      - 'signal-fuel-graph.js'
      - 'signal-docs-library.js'
      - 'docs/**'
      - 'signal-import-flow.js'
      - 'README.md'
      - 'signal-v4.css'
      - 'signal-experience.css'
      - 'ai-tuner.js'
      - 'signal-intelligence.js'
      - 'signal-brain.js'
      - 'signal-units.js'
      - 'calibration-intelligence.js'
      - 'garage-beta.js'
      - 'sw.js'
      - 'manifest.json'
      - 'tests/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'ai-tuner.js'
      - 'signal-intelligence.js'
      - 'signal-brain.js'
      - 'signal-units.js'
      - 'calibration-intelligence.js'
      - 'garage-beta.js'
      - 'sw.js'
      - 'manifest.json'
      - 'tests/**'
      - '.github/workflows/verify.yml'

jobs:
  channel-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check signal-experience.js
          node --check signal-v4-core.js
          node --check signal-v4.js
          node --check signal-fuel-graph.js
          node --check signal-docs-library.js
          node --check signal-import-flow.js
          node --check docs/wiki.js
          node --check docs/catalog.js
          node --check ai-tuner.js
          node --check signal-intelligence.js
          node --check signal-brain.js
          node --check signal-units.js
          node --check calibration-intelligence.js
          node --check garage-beta.js
          node --check sw.js
      - name: Validate mapping safety
        run: node --test tests/*.test.js
